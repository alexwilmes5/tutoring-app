<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <title>{% block title %}Newspaper App{% endblock title %}</title> 
  <!-- Bootstrap CSS --> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"  
    crossorigin="anonymous">
</head>

<body class="bg-light text-dark"> 
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary shadow-sm py-3"> 
  <div class="container-fluid px-4"> 
    <!-- Brand Title -->
    <a class="navbar-brand fw-bold text-primary" href="{% url 'home' %}">
       Tutoring App
    </a> 
    
    <button class="navbar-toggler" type="button"  
        data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" 
        aria-controls="navbarSupportedContent" aria-expanded="false"  
        aria-label="Toggle navigation"> 
      <span class="navbar-toggler-icon"></span> 
    </button> 

    <div class="collapse navbar-collapse" id="navbarSupportedContent"> 
      <!-- Navigation Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center">
        <li class="nav-item"> 
          <a class="nav-link active px-3" aria-current="page" href="{% url 'home' %}">Home</a> 
        </li> 
      </ul>    
      
      <!-- Right Side Context Menu -->
      <ul class="navbar-nav ms-auto align-items-center"> 
        {% if user.is_authenticated %}
          <li class="nav-item dropdown"> 
            <a class="nav-link dropdown-toggle bg-secondary bg-opacity-25 rounded-pill px-3 py-1 text-white fw-medium" 
               href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              {{ user.username }} 
            </a> 
            <ul class="dropdown-menu dropdown-menu-end shadow mt-2"> 
              <li>
                <a class="dropdown-item" href="{% url 'password_change' %}"> Change password</a>
              </li> 
              <li><hr class="dropdown-divider"></li> 
              <li> 
                <form method="post" action="{% url 'logout' %}" class="px-2">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-danger btn-sm w-100 rounded">Log Out</button>
                </form>
              </li> 
            </ul>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="btn btn-primary btn-sm px-4 rounded-pill fw-medium" href="{% url 'login' %}">Log In</a>
          </li>
        {% endif %}
      </ul> 
    </div>
  </div>
</nav>

  <main> 
    <div class="container"> 
      {% block content %} 
      {% endblock content %} 
    </div> 
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
